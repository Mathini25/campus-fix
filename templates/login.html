{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="mb-4 text-center">Login to CampusFix</h3>
          <form method="post">
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
          <p class="text-center mt-3 mb-0">
            Need an account? <a href="{{ url_for('register') }}">Register here</a>
          </p>
          <p class="text-center mb-0"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
          <div class="mt-4 small text-muted">
            <strong>Demo admin:</strong> admin@campusfix.com / admin123<br>
            <strong>Demo student:</strong> student@campusfix.com / student123
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
