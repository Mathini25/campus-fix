{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Choose a new password</h1>
          <form method="post">
            <label class="form-label" for="password">New password</label>
            <input class="form-control" id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
            <div class="form-text">Use at least 10 characters.</div>
            <button class="btn btn-primary w-100 mt-3" type="submit">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
