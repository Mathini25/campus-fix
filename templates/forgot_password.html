{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Reset your password</h1>
          <p class="text-muted">Enter your account email. If it is registered, CampusFix will send a one-time reset link that expires after 30 minutes.</p>
          <form method="post">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
            <button class="btn btn-primary w-100 mt-3" type="submit">Send reset link</button>
          </form>
          <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Back to login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
